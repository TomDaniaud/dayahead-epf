[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dayahead-epf"
version = "0.1.0"
description = "Day-ahead electricity price forecasting: walk-forward backtesting, forecast KPIs and drift-triggered retraining."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tom Daniaud" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
deep = ["torch>=2.1"]
entsoe = ["entsoe-py>=0.6"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7"]

[project.scripts]
epf = "epf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
